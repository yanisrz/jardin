<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Création d'Espace Personnel - Jardin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 50px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1.05em;
        }

        input[type="text"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .checkbox-group {
            display: flex;
            gap: 20px;
            margin-top: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-item label {
            margin: 0;
            font-weight: 400;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }

        button {
            flex: 1;
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .success-message {
            display: none;
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 30px;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🌱 Créer mon Espace Personnel</h1>
        <p class="subtitle">Configurez votre jardin personnel unique</p>

        <div class="info-box">
            ℹ️ Remplissez le formulaire ci-dessous pour créer votre espace personnel personnalisé.
        </div>

        <form id="espacePersopForm">
            <!-- Informations de base -->
            <div class="form-group">
                <label for="nom">Nom de l'espace *</label>
                <input type="text" id="nom" name="nom" placeholder="Ex: Mon jardin secret" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" placeholder="votre@email.com" required>
                </div>
                <div class="form-group">
                    <label for="username">Pseudonyme *</label>
                    <input type="text" id="username" name="username" placeholder="Mon pseudonyme" required>
                </div>
            </div>

            <!-- Description -->
            <div class="form-group">
                <label for="description">Description de votre espace</label>
                <textarea id="description" name="description"
                    placeholder="Décrivez votre espace personnel, vos objectifs..."></textarea>
            </div>

            <!-- Type d'espace -->
            <div class="form-group">
                <label for="type">Type d'espace *</label>
                <select id="type" name="type" required>
                    <option value="">-- Sélectionnez un type --</option>
                    <option value="portfolio">Portfolio</option>
                    <option value="blog">Blog personnel</option>
                    <option value="galerie">Galerie</option>
                    <option value="cv">CV en ligne</option>
                    <option value="autre">Autre</option>
                </select>
            </div>

            <!-- Préférences -->
            <div class="form-group">
                <label>Fonctionnalités désirées</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="feat-contact" name="features" value="contact">
                        <label for="feat-contact">Formulaire de contact</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="feat-blog" name="features" value="blog">
                        <label for="feat-blog">Section blog</label>
                    </div>
                </div>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="feat-gallery" name="features" value="gallery">
                        <label for="feat-gallery">Galerie média</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="feat-cv" name="features" value="cv">
                        <label for="feat-cv">Section CV</label>
                    </div>
                </div>
            </div>

            <!-- Couleur de thème -->
            <div class="form-group">
                <label for="theme">Thème de couleur</label>
                <select id="theme" name="theme">
                    <option value="default">Défaut (Violet)</option>
                    <option value="blue">Bleu</option>
                    <option value="green">Vert</option>
                    <option value="orange">Orange</option>
                    <option value="red">Rouge</option>
                </select>
            </div>

            <!-- Boutons -->
            <div class="btn-group">
                <button type="submit" class="btn-submit">✨ Créer mon Espace</button>
                <button type="reset" class="btn-reset">Réinitialiser</button>
            </div>

            <div class="success-message" id="successMessage">
                ✅ Votre espace personnel a été créé avec succès !
            </div>
        </form>
    </div>

    <script>
        document.getElementById('espacePersopForm').addEventListener('submit', function (e) {
            e.preventDefault();

            // Récupérer les données
            const formData = {
                nom: document.getElementById('nom').value,
                email: document.getElementById('email').value,
                username: document.getElementById('username').value,
                description: document.getElementById('description').value,
                type: document.getElementById('type').value,
                theme: document.getElementById('theme').value,
                features: Array.from(document.querySelectorAll('input[name="features"]:checked'))
                    .map(el => el.value)
            };

            // Afficher le message de succès
            const successMsg = document.getElementById('successMessage');
            successMsg.style.display = 'block';

            // Log les données (en production, envoyer au serveur)
            console.log('Espace personnel créé:', formData);

            // Réinitialiser le formulaire après 2 secondes
            setTimeout(() => {
                this.reset();
                successMsg.style.display = 'none';
            }, 2000);
        });
    </script>
</body>

</html>
